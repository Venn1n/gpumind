<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPUMind</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #09090b;
            --surface: rgba(255,255,255,0.03);
            --surface-hover: rgba(255,255,255,0.06);
            --border: rgba(255,255,255,0.08);
            --text: #fafafa;
            --text-dim: #71717a;
            --accent: #3b82f6;
            --green: #22c55e;
            --orange: #f97316;
            --red: #ef4444;
            --purple: #a855f7;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Ambient background */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 20%, rgba(59,130,246,0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(168,85,247,0.06) 0%, transparent 40%);
            animation: ambientMove 20s ease-in-out infinite alternate;
            z-index: -1;
        }

        @keyframes ambientMove {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(-5%, -5%) rotate(3deg); }
        }

        /* Header */
        header {
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent), var(--purple));
            border-radius: 10px;
            display: grid;
            place-items: center;
            font-size: 18px;
        }

        .brand h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .brand span { color: var(--text-dim); font-weight: 400; }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .live-dot {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-dim);
        }

        .live-dot::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--green);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(34,197,94,0.4); }
            50% { opacity: 0.8; box-shadow: 0 0 0 8px rgba(34,197,94,0); }
        }

        /* Main */
        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px;
        }

        /* Stats row */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px 24px;
            transition: all 0.3s ease;
        }

        .stat:hover {
            background: var(--surface-hover);
            transform: translateY(-2px);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 600;
            letter-spacing: -1px;
        }

        .stat-value small {
            font-size: 14px;
            color: var(--text-dim);
            font-weight: 400;
            margin-left: 4px;
        }

        .stat-change {
            font-size: 12px;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .stat-change.up { color: var(--green); }
        .stat-change.down { color: var(--red); }

        /* GPU Grid */
        .section-title {
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 16px;
            font-weight: 500;
        }

        .gpu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }

        .gpu-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .gpu-card:hover {
            background: var(--surface-hover);
            border-color: rgba(255,255,255,0.12);
            transform: translateY(-4px);
        }

        /* Animated gradient border on active */
        .gpu-card.active::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 20px;
            padding: 1px;
            background: linear-gradient(135deg, var(--accent), var(--purple), var(--accent));
            background-size: 200% 200%;
            animation: gradientShift 3s ease infinite;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .gpu-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
        }

        .gpu-info h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .gpu-info p {
            font-size: 13px;
            color: var(--text-dim);
        }

        .gpu-status {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .gpu-status.mining {
            background: rgba(34,197,94,0.1);
            color: var(--green);
        }

        .gpu-status.inference {
            background: rgba(59,130,246,0.1);
            color: var(--accent);
        }

        .gpu-status.idle {
            background: rgba(113,113,122,0.1);
            color: var(--text-dim);
        }

        /* Circular progress */
        .gpu-metrics {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }

        .metric {
            text-align: center;
        }

        .metric-ring {
            position: relative;
            width: 72px;
            height: 72px;
            margin: 0 auto 10px;
        }

        .metric-ring svg {
            transform: rotate(-90deg);
        }

        .metric-ring circle {
            fill: none;
            stroke-width: 4;
        }

        .metric-ring .bg {
            stroke: rgba(255,255,255,0.06);
        }

        .metric-ring .progress {
            stroke-linecap: round;
            transition: stroke-dashoffset 1s ease;
        }

        .metric-ring .value {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-size: 14px;
            font-weight: 600;
        }

        .metric-label {
            font-size: 11px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* GPU Actions */
        .gpu-actions {
            display: flex;
            gap: 8px;
        }

        .gpu-actions button {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: transparent;
            color: var(--text);
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .gpu-actions button:hover {
            background: var(--surface-hover);
            border-color: rgba(255,255,255,0.15);
        }

        .gpu-actions button.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        /* Hashrate chart */
        .chart-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 32px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .chart-header h3 {
            font-size: 16px;
            font-weight: 600;
        }

        .chart-tabs {
            display: flex;
            gap: 4px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            padding: 4px;
        }

        .chart-tabs button {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--text-dim);
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chart-tabs button.active {
            background: rgba(255,255,255,0.1);
            color: var(--text);
        }

        .chart-area {
            height: 240px;
            position: relative;
        }

        /* Canvas chart */
        #hashrateChart {
            width: 100%;
            height: 100%;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 24px;
            color: var(--text-dim);
            font-size: 12px;
            border-top: 1px solid var(--border);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
            .gpu-grid { grid-template-columns: 1fr; }
            .gpu-metrics { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 600px) {
            .stats { grid-template-columns: 1fr; }
            main { padding: 16px; }
        }

        /* Smooth entrance animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .stat, .gpu-card, .chart-section {
            animation: fadeUp 0.6s ease forwards;
        }

        .stat:nth-child(1) { animation-delay: 0.05s; }
        .stat:nth-child(2) { animation-delay: 0.1s; }
        .stat:nth-child(3) { animation-delay: 0.15s; }
        .stat:nth-child(4) { animation-delay: 0.2s; }

        .gpu-card:nth-child(1) { animation-delay: 0.1s; }
        .gpu-card:nth-child(2) { animation-delay: 0.15s; }
        .gpu-card:nth-child(3) { animation-delay: 0.2s; }
        .gpu-card:nth-child(4) { animation-delay: 0.25s; }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <div class="brand-icon">⚡</div>
            <h1>GPUMind <span>/ dashboard</span></h1>
        </div>
        <div class="header-right">
            <span class="live-dot">Live</span>
        </div>
    </header>

    <main>
        <!-- Stats -->
        <div class="stats">
            <div class="stat">
                <div class="stat-label">Total Hashrate</div>
                <div class="stat-value" id="totalHR">10.64<small>Gh/s</small></div>
                <div class="stat-change up">↑ 2.3% from last hour</div>
            </div>
            <div class="stat">
                <div class="stat-label">Balance</div>
                <div class="stat-value" id="balance">48,833<small>KRX</small></div>
                <div class="stat-change up">↑ 1,200 today</div>
            </div>
            <div class="stat">
                <div class="stat-label">Power Draw</div>
                <div class="stat-value" id="power">2,251<small>W</small></div>
                <div class="stat-change">● 4 GPUs active</div>
            </div>
            <div class="stat">
                <div class="stat-label">Efficiency</div>
                <div class="stat-value">4.73<small>MH/J</small></div>
                <div class="stat-change up">↑ Optimal</div>
            </div>
        </div>

        <!-- GPU Cards -->
        <div class="section-title">GPU Performance</div>
        <div class="gpu-grid" id="gpuGrid"></div>

        <!-- Chart -->
        <div class="chart-section">
            <div class="chart-header">
                <h3>Hashrate Overview</h3>
                <div class="chart-tabs">
                    <button class="active" onclick="setRange('1h')">1H</button>
                    <button onclick="setRange('6h')">6H</button>
                    <button onclick="setRange('24h')">24H</button>
                    <button onclick="setRange('7d')">7D</button>
                </div>
            </div>
            <div class="chart-area">
                <canvas id="hashrateChart"></canvas>
            </div>
        </div>
    </main>

    <footer>
        GPUMind v0.1.0 · AI-Powered GPU Resource Manager
    </footer>

    <script>
        // GPU data
        const gpus = [
            { id: 0, name: 'GPU #0', model: 'RTX 5090', mode: 'mining', hr: 2.67, temp: 78, power: 575, util: 100 },
            { id: 1, name: 'GPU #1', model: 'RTX 5090', mode: 'mining', hr: 2.69, temp: 76, power: 570, util: 100 },
            { id: 2, name: 'GPU #2', model: 'RTX 5090', mode: 'mining', hr: 2.66, temp: 72, power: 574, util: 99 },
            { id: 3, name: 'GPU #3', model: 'RTX 5090', mode: 'mining', hr: 2.62, temp: 72, power: 527, util: 100 },
        ];

        // Render GPU cards
        function renderGPUs() {
            const grid = document.getElementById('gpuGrid');
            grid.innerHTML = gpus.map(gpu => {
                const circumference = 2 * Math.PI * 30;
                const tempOffset = circumference - (gpu.temp / 100) * circumference;
                const powerOffset = circumference - (gpu.power / 600) * circumference;
                const utilOffset = circumference - (gpu.util / 100) * circumference;
                const hrOffset = circumference - (gpu.hr / 3) * circumference;
                
                const tempColor = gpu.temp > 80 ? 'var(--red)' : gpu.temp > 70 ? 'var(--orange)' : 'var(--green)';
                
                return `
                    <div class="gpu-card ${gpu.mode !== 'idle' ? 'active' : ''}">
                        <div class="gpu-header">
                            <div class="gpu-info">
                                <h3>${gpu.name}</h3>
                                <p>${gpu.model}</p>
                            </div>
                            <div class="gpu-status ${gpu.mode}">
                                ${gpu.mode === 'mining' ? '⛏️ Mining' : gpu.mode === 'inference' ? '🧠 Inference' : '○ Idle'}
                            </div>
                        </div>
                        
                        <div class="gpu-metrics">
                            <div class="metric">
                                <div class="metric-ring">
                                    <svg width="72" height="72" viewBox="0 0 72 72">
                                        <circle class="bg" cx="36" cy="36" r="30"/>
                                        <circle class="progress" cx="36" cy="36" r="30" 
                                            stroke="var(--green)"
                                            stroke-dasharray="${circumference}"
                                            stroke-dashoffset="${hrOffset}"/>
                                    </svg>
                                    <div class="value">${gpu.hr}</div>
                                </div>
                                <div class="metric-label">GH/s</div>
                            </div>
                            
                            <div class="metric">
                                <div class="metric-ring">
                                    <svg width="72" height="72" viewBox="0 0 72 72">
                                        <circle class="bg" cx="36" cy="36" r="30"/>
                                        <circle class="progress" cx="36" cy="36" r="30"
                                            stroke="${tempColor}"
                                            stroke-dasharray="${circumference}"
                                            stroke-dashoffset="${tempOffset}"/>
                                    </svg>
                                    <div class="value">${gpu.temp}°</div>
                                </div>
                                <div class="metric-label">Temp</div>
                            </div>
                            
                            <div class="metric">
                                <div class="metric-ring">
                                    <svg width="72" height="72" viewBox="0 0 72 72">
                                        <circle class="bg" cx="36" cy="36" r="30"/>
                                        <circle class="progress" cx="36" cy="36" r="30"
                                            stroke="var(--purple)"
                                            stroke-dasharray="${circumference}"
                                            stroke-dashoffset="${powerOffset}"/>
                                    </svg>
                                    <div class="value">${gpu.power}</div>
                                </div>
                                <div class="metric-label">Watts</div>
                            </div>
                            
                            <div class="metric">
                                <div class="metric-ring">
                                    <svg width="72" height="72" viewBox="0 0 72 72">
                                        <circle class="bg" cx="36" cy="36" r="30"/>
                                        <circle class="progress" cx="36" cy="36" r="30"
                                            stroke="var(--accent)"
                                            stroke-dasharray="${circumference}"
                                            stroke-dashoffset="${utilOffset}"/>
                                    </svg>
                                    <div class="value">${gpu.util}%</div>
                                </div>
                                <div class="metric-label">Usage</div>
                            </div>
                        </div>
                        
                        <div class="gpu-actions">
                            <button class="${gpu.mode === 'mining' ? 'active' : ''}" onclick="setMode(${gpu.id}, 'mining')">⛏️ Mining</button>
                            <button class="${gpu.mode === 'inference' ? 'active' : ''}" onclick="setMode(${gpu.id}, 'inference')">🧠 AI</button>
                            <button onclick="setMode(${gpu.id}, 'hybrid')">⚡ Hybrid</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Smooth chart
        function drawChart() {
            const canvas = document.getElementById('hashrateChart');
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            
            canvas.width = canvas.offsetWidth * dpr;
            canvas.height = canvas.offsetHeight * dpr;
            ctx.scale(dpr, dpr);
            
            const w = canvas.offsetWidth;
            const h = canvas.offsetHeight;
            const padding = { top: 20, right: 20, bottom: 30, left: 50 };
            
            // Generate smooth data
            const points = 60;
            const data = [];
            let value = 10.5;
            for (let i = 0; i < points; i++) {
                value += (Math.random() - 0.5) * 0.3;
                value = Math.max(9.5, Math.min(11.5, value));
                data.push(value);
            }
            
            const min = Math.floor(Math.min(...data) - 0.5);
            const max = Math.ceil(Math.max(...data) + 0.5);
            
            const chartW = w - padding.left - padding.right;
            const chartH = h - padding.top - padding.bottom;
            
            // Grid
            ctx.strokeStyle = 'rgba(255,255,255,0.04)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 4; i++) {
                const y = padding.top + (chartH * i / 4);
                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(w - padding.right, y);
                ctx.stroke();
                
                const val = max - ((max - min) * i / 4);
                ctx.fillStyle = '#52525b';
                ctx.font = '11px Inter';
                ctx.textAlign = 'right';
                ctx.fillText(val.toFixed(1), padding.left - 10, y + 4);
            }
            
            // Time labels
            const times = ['60m', '45m', '30m', '15m', 'now'];
            times.forEach((t, i) => {
                const x = padding.left + (chartW * i / (times.length - 1));
                ctx.fillStyle = '#52525b';
                ctx.textAlign = 'center';
                ctx.fillText(t, x, h - 8);
            });
            
            // Smooth line using bezier
            const getX = (i) => padding.left + (chartW * i / (points - 1));
            const getY = (v) => padding.top + chartH - ((v - min) / (max - min) * chartH);
            
            // Gradient fill
            const gradient = ctx.createLinearGradient(0, padding.top, 0, h - padding.bottom);
            gradient.addColorStop(0, 'rgba(59,130,246,0.15)');
            gradient.addColorStop(1, 'rgba(59,130,246,0)');
            
            ctx.beginPath();
            ctx.moveTo(getX(0), h - padding.bottom);
            ctx.lineTo(getX(0), getY(data[0]));
            
            for (let i = 1; i < points; i++) {
                const x0 = getX(i - 1), y0 = getY(data[i - 1]);
                const x1 = getX(i), y1 = getY(data[i]);
                const cx = (x0 + x1) / 2;
                ctx.bezierCurveTo(cx, y0, cx, y1, x1, y1);
            }
            
            ctx.lineTo(getX(points - 1), h - padding.bottom);
            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Line
            ctx.beginPath();
            ctx.moveTo(getX(0), getY(data[0]));
            
            for (let i = 1; i < points; i++) {
                const x0 = getX(i - 1), y0 = getY(data[i - 1]);
                const x1 = getX(i), y1 = getY(data[i]);
                const cx = (x0 + x1) / 2;
                ctx.bezierCurveTo(cx, y0, cx, y1, x1, y1);
            }
            
            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 2.5;
            ctx.stroke();
            
            // Glow
            ctx.shadowColor = '#3b82f6';
            ctx.shadowBlur = 10;
            ctx.stroke();
            ctx.shadowBlur = 0;
            
            // End dot
            const lastX = getX(points - 1);
            const lastY = getY(data[points - 1]);
            
            ctx.beginPath();
            ctx.arc(lastX, lastY, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#3b82f6';
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(lastX, lastY, 8, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(59,130,246,0.3)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function setMode(gpuId, mode) {
            gpus[gpuId].mode = mode;
            renderGPUs();
        }

        function setRange(range) {
            document.querySelectorAll('.chart-tabs button').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            drawChart();
        }

        // Init
        renderGPUs();
        drawChart();
        window.addEventListener('resize', drawChart);
        
        // Live updates
        setInterval(() => {
            gpus.forEach(gpu => {
                gpu.hr = (2.5 + Math.random() * 0.3).toFixed(2);
                gpu.temp = Math.floor(70 + Math.random() * 10);
            });
            renderGPUs();
        }, 5000);
    </script>
</body>
</html>
