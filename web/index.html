<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPUMind Dashboard</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --card: #12121a;
            --border: #1e1e2e;
            --accent: #FF3B3B;
            --green: #00ff88;
            --blue: #00aaff;
            --yellow: #ffaa00;
            --text: #e0e0e0;
            --dim: #666;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(180deg, #151520 0%, var(--bg) 100%);
            border-bottom: 1px solid var(--border);
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent) 0%, #ff6b6b 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .logo h1 {
            font-size: 24px;
            font-weight: 600;
            color: white;
        }

        .logo h1 span { color: var(--accent); }

        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(0, 255, 136, 0.15);
            color: var(--green);
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .status-badge.warning {
            background: rgba(255, 170, 0, 0.15);
            color: var(--yellow);
            border-color: rgba(255, 170, 0, 0.3);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .stat-card .label {
            font-size: 12px;
            color: var(--dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: 700;
            color: white;
        }

        .stat-card .unit {
            font-size: 14px;
            color: var(--dim);
            margin-left: 4px;
        }

        .stat-card.highlight .value { color: var(--accent); }
        .stat-card.green .value { color: var(--green); }

        .gpu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .gpu-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        .gpu-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), #ff6b6b);
        }

        .gpu-card.mining::before { background: linear-gradient(90deg, var(--green), #00cc6a); }
        .gpu-card.inference::before { background: linear-gradient(90deg, var(--blue), #00ccff); }
        .gpu-card.idle::before { background: var(--dim); }

        .gpu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .gpu-name {
            font-size: 16px;
            font-weight: 600;
            color: white;
        }

        .gpu-model {
            font-size: 12px;
            color: var(--dim);
            margin-top: 2px;
        }

        .mode-badge {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .mode-badge.mining {
            background: rgba(0, 255, 136, 0.15);
            color: var(--green);
        }

        .mode-badge.inference {
            background: rgba(0, 170, 255, 0.15);
            color: var(--blue);
        }

        .mode-badge.idle {
            background: rgba(102, 102, 102, 0.2);
            color: var(--dim);
        }

        .gpu-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .metric {
            display: flex;
            flex-direction: column;
        }

        .metric .label {
            font-size: 11px;
            color: var(--dim);
            margin-bottom: 4px;
        }

        .metric .value {
            font-size: 18px;
            font-weight: 600;
        }

        .metric .bar {
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin-top: 6px;
            overflow: hidden;
        }

        .metric .bar-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.5s ease;
        }

        .temp-fill { background: var(--green); }
        .temp-fill.hot { background: var(--yellow); }
        .temp-fill.critical { background: var(--accent); }

        .power-fill { background: var(--blue); }
        .util-fill { background: var(--accent); }

        .gpu-actions {
            display: flex;
            gap: 8px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-mining {
            background: rgba(0, 255, 136, 0.15);
            color: var(--green);
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .btn-mining:hover { background: rgba(0, 255, 136, 0.25); }

        .btn-inference {
            background: rgba(0, 170, 255, 0.15);
            color: var(--blue);
            border: 1px solid rgba(0, 170, 255, 0.3);
        }

        .btn-inference:hover { background: rgba(0, 170, 255, 0.25); }

        .btn-hybrid {
            background: rgba(255, 170, 0, 0.15);
            color: var(--yellow);
            border: 1px solid rgba(255, 170, 0, 0.3);
        }

        .btn-hybrid:hover { background: rgba(255, 170, 0, 0.25); }

        .section-title {
            font-size: 14px;
            color: var(--dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }

        .chart-container {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .chart-title {
            font-size: 16px;
            font-weight: 600;
            color: white;
        }

        .chart-tabs {
            display: flex;
            gap: 8px;
        }

        .chart-tab {
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--dim);
            cursor: pointer;
        }

        .chart-tab.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        canvas {
            width: 100% !important;
            height: 200px !important;
        }

        .earnings-table {
            width: 100%;
            border-collapse: collapse;
        }

        .earnings-table th,
        .earnings-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .earnings-table th {
            color: var(--dim);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .earnings-table td {
            color: white;
            font-size: 14px;
        }

        .refresh-indicator {
            font-size: 11px;
            color: var(--dim);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--green);
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <div class="logo-icon">🧠</div>
            <div>
                <h1>GPU<span>Mind</span></h1>
            </div>
        </div>
        <div style="display: flex; align-items: center; gap: 16px;">
            <span class="refresh-indicator">
                <span class="live-dot"></span>
                <span id="lastUpdate">Loading...</span>
            </span>
            <div class="status-badge" id="systemStatus">● Online</div>
        </div>
    </header>

    <div class="container">
        <!-- Summary Stats -->
        <div class="stats-row">
            <div class="stat-card highlight">
                <div class="label">Total Hashrate</div>
                <div class="value" id="totalHashrate">0<span class="unit">GH/s</span></div>
            </div>
            <div class="stat-card green">
                <div class="label">Balance (KRX)</div>
                <div class="value" id="balance">0<span class="unit">KRX</span></div>
            </div>
            <div class="stat-card">
                <div class="label">Total Power</div>
                <div class="value" id="totalPower">0<span class="unit">W</span></div>
            </div>
            <div class="stat-card">
                <div class="label">Avg Temperature</div>
                <div class="value" id="avgTemp">0<span class="unit">°C</span></div>
            </div>
            <div class="stat-card">
                <div class="label">Mode Switches</div>
                <div class="value" id="totalSwitches">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Uptime</div>
                <div class="value" id="uptime">0<span class="unit">h</span></div>
            </div>
        </div>

        <!-- GPU Cards -->
        <div class="section-title">GPU Status</div>
        <div class="gpu-grid" id="gpuGrid">
            <!-- Generated by JS -->
        </div>

        <!-- Hashrate Chart -->
        <div class="chart-container">
            <div class="chart-header">
                <div class="chart-title">Hashrate History</div>
                <div class="chart-tabs">
                    <button class="chart-tab active" data-range="1h">1H</button>
                    <button class="chart-tab" data-range="6h">6H</button>
                    <button class="chart-tab" data-range="24h">24H</button>
                </div>
            </div>
            <canvas id="hashrateChart"></canvas>
        </div>

        <!-- Earnings Table -->
        <div class="chart-container">
            <div class="chart-header">
                <div class="chart-title">Earnings Estimation</div>
            </div>
            <table class="earnings-table">
                <thead>
                    <tr>
                        <th>Period</th>
                        <th>Mining Revenue</th>
                        <th>AI Inference</th>
                        <th>Total (USD)</th>
                    </tr>
                </thead>
                <tbody id="earningsBody">
                    <!-- Generated by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Mock data for demo - replace with actual API calls
        const API_BASE = window.location.hostname === 'localhost' 
            ? 'http://localhost:8500' 
            : `http://${window.location.hostname}:8500`;

        let hashrateHistory = [];
        const MAX_HISTORY = 60;

        // Generate initial history
        for (let i = 0; i < MAX_HISTORY; i++) {
            hashrateHistory.push({
                time: Date.now() - (MAX_HISTORY - i) * 300000,
                hashrate: 10 + Math.random() * 1.5
            });
        }

        function renderGPU(gpu) {
            const tempClass = gpu.temperature > 85 ? 'critical' : gpu.temperature > 75 ? 'hot' : '';
            const modeClass = gpu.mode === 'mining' ? 'mining' : gpu.mode === 'inference' ? 'inference' : 'idle';
            
            return `
                <div class="gpu-card ${modeClass}">
                    <div class="gpu-header">
                        <div>
                            <div class="gpu-name">GPU #${gpu.id}</div>
                            <div class="gpu-model">${gpu.name || 'RTX 5090'}</div>
                        </div>
                        <span class="mode-badge ${modeClass}">${gpu.mode || 'idle'}</span>
                    </div>
                    <div class="gpu-metrics">
                        <div class="metric">
                            <span class="label">Hashrate</span>
                            <span class="value" style="color: var(--green)">${gpu.hashrate?.toFixed(2) || '0.00'} GH/s</span>
                        </div>
                        <div class="metric">
                            <span class="label">Utilization</span>
                            <span class="value">${gpu.utilization || 0}%</span>
                            <div class="bar"><div class="bar-fill util-fill" style="width: ${gpu.utilization || 0}%"></div></div>
                        </div>
                        <div class="metric">
                            <span class="label">Temperature</span>
                            <span class="value">${gpu.temperature || 0}°C</span>
                            <div class="bar"><div class="bar-fill temp-fill ${tempClass}" style="width: ${Math.min(100, (gpu.temperature || 0))}%"></div></div>
                        </div>
                        <div class="metric">
                            <span class="label">Power</span>
                            <span class="value">${gpu.power || 0}W</span>
                            <div class="bar"><div class="bar-fill power-fill" style="width: ${(gpu.power || 0) / 6}%"></div></div>
                        </div>
                    </div>
                    <div class="gpu-actions">
                        <button class="btn btn-mining" onclick="setMode(${gpu.id}, 'mining')">⛏️ Mining</button>
                        <button class="btn btn-inference" onclick="setMode(${gpu.id}, 'inference')">🧠 Inference</button>
                        <button class="btn btn-hybrid" onclick="setMode(${gpu.id}, 'hybrid')">⚡ Hybrid</button>
                    </div>
                </div>
            `;
        }

        function renderGPUs(gpus) {
            document.getElementById('gpuGrid').innerHTML = gpus.map(renderGPU).join('');
        }

        function updateStats(data) {
            const gpus = data.gpus || [];
            
            // Total hashrate
            const totalHR = gpus.reduce((sum, g) => sum + (g.hashrate || 0), 0);
            document.getElementById('totalHashrate').innerHTML = 
                `${totalHR.toFixed(2)}<span class="unit">GH/s</span>`;
            
            // Total power
            const totalPower = gpus.reduce((sum, g) => sum + (g.power || 0), 0);
            document.getElementById('totalPower').innerHTML = 
                `${totalPower.toFixed(0)}<span class="unit">W</span>`;
            
            // Avg temp
            const temps = gpus.filter(g => g.temperature > 0).map(g => g.temperature);
            const avgTemp = temps.length ? temps.reduce((a, b) => a + b, 0) / temps.length : 0;
            document.getElementById('avgTemp').innerHTML = 
                `${avgTemp.toFixed(0)}<span class="unit">°C</span>`;
            
            // Switches
            document.getElementById('totalSwitches').textContent = 
                data.metrics?.total_switches || 0;
            
            // Uptime
            const uptime = data.metrics?.uptime_hours || 0;
            document.getElementById('uptime').innerHTML = 
                `${uptime.toFixed(1)}<span class="unit">h</span>`;
            
            // Update timestamp
            document.getElementById('lastUpdate').textContent = 
                `Updated ${new Date().toLocaleTimeString()}`;
        }

        function updateEarnings() {
            // Mock earnings - replace with API call
            const rows = [
                { period: 'Last Hour', mining: '4.05 KRX', inference: '$0.01', total: '$0.05' },
                { period: 'Last 24 Hours', mining: '97.20 KRX', inference: '$0.24', total: '$1.21' },
                { period: 'Last 7 Days', mining: '680.40 KRX', inference: '$1.68', total: '$8.48' },
                { period: 'Last 30 Days', mining: '2,916 KRX', inference: '$7.20', total: '$36.36' },
            ];
            
            document.getElementById('earningsBody').innerHTML = rows.map(r => `
                <tr>
                    <td>${r.period}</td>
                    <td style="color: var(--green)">${r.mining}</td>
                    <td style="color: var(--blue)">${r.inference}</td>
                    <td style="color: white">${r.total}</td>
                </tr>
            `).join('');
        }

        function drawChart() {
            const canvas = document.getElementById('hashrateChart');
            const ctx = canvas.getContext('2d');
            const rect = canvas.parentElement.getBoundingClientRect();
            
            canvas.width = rect.width - 48;
            canvas.height = 200;
            
            const width = canvas.width;
            const height = canvas.height;
            const padding = { top: 20, right: 20, bottom: 30, left: 50 };
            const chartWidth = width - padding.left - padding.right;
            const chartHeight = height - padding.top - padding.bottom;
            
            ctx.clearRect(0, 0, width, height);
            
            // Find range
            const values = hashrateHistory.map(h => h.hashrate);
            const minVal = Math.floor(Math.min(...values) - 1);
            const maxVal = Math.ceil(Math.max(...values) + 1);
            
            // Grid lines
            ctx.strokeStyle = '#1e1e2e';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 4; i++) {
                const y = padding.top + (chartHeight * i / 4);
                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(width - padding.right, y);
                ctx.stroke();
                
                // Labels
                const val = maxVal - ((maxVal - minVal) * i / 4);
                ctx.fillStyle = '#666';
                ctx.font = '11px monospace';
                ctx.textAlign = 'right';
                ctx.fillText(val.toFixed(1), padding.left - 8, y + 4);
            }
            
            // Draw line
            ctx.beginPath();
            ctx.strokeStyle = '#FF3B3B';
            ctx.lineWidth = 2;
            
            hashrateHistory.forEach((point, i) => {
                const x = padding.left + (chartWidth * i / (MAX_HISTORY - 1));
                const y = padding.top + chartHeight - ((point.hashrate - minVal) / (maxVal - minVal) * chartHeight);
                
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();
            
            // Fill gradient
            const gradient = ctx.createLinearGradient(0, padding.top, 0, height - padding.bottom);
            gradient.addColorStop(0, 'rgba(255, 59, 59, 0.3)');
            gradient.addColorStop(1, 'rgba(255, 59, 59, 0)');
            
            ctx.lineTo(width - padding.right, height - padding.bottom);
            ctx.lineTo(padding.left, height - padding.bottom);
            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.fill();
        }

        async function setMode(gpuId, mode) {
            try {
                await fetch(`${API_BASE}/mode`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ gpu_id: gpuId, mode })
                });
                fetchStatus();
            } catch (e) {
                console.error('Mode switch failed:', e);
            }
        }

        async function fetchStatus() {
            try {
                const res = await fetch(`${API_BASE}/status`);
                const data = await res.json();
                renderGPUs(data.gpus || []);
                updateStats(data);
            } catch (e) {
                console.log('API not connected, using demo data');
                // Demo data
                renderGPUs([
                    { id: 0, name: 'RTX 5090', mode: 'mining', hashrate: 2.67, temperature: 78, power: 575, utilization: 100 },
                    { id: 1, name: 'RTX 5090', mode: 'mining', hashrate: 2.69, temperature: 76, power: 570, utilization: 100 },
                    { id: 2, name: 'RTX 5090', mode: 'mining', hashrate: 2.66, temperature: 72, power: 574, utilization: 99 },
                    { id: 3, name: 'RTX 5090', mode: 'mining', hashrate: 2.62, temperature: 72, power: 527, utilization: 100 },
                ]);
                updateStats({
                    gpus: [
                        { hashrate: 2.67, power: 575, temperature: 78, utilization: 100 },
                        { hashrate: 2.69, power: 570, temperature: 76, utilization: 100 },
                        { hashrate: 2.66, power: 574, temperature: 72, utilization: 99 },
                        { hashrate: 2.62, power: 527, temperature: 72, utilization: 100 },
                    ],
                    metrics: { total_switches: 42, uptime_hours: 24.5 }
                });
            }
            
            // Update chart
            hashrateHistory.push({
                time: Date.now(),
                hashrate: 10 + Math.random() * 1.5
            });
            if (hashrateHistory.length > MAX_HISTORY) hashrateHistory.shift();
            drawChart();
        }

        // Init
        fetchStatus();
        updateEarnings();

        // Refresh every 30 seconds
        setInterval(fetchStatus, 30000);

        // Chart resize
        window.addEventListener('resize', drawChart);

        // Tab switching
        document.querySelectorAll('.chart-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.chart-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
            });
        });
    </script>
</body>
</html>
