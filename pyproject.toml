[project]
name = "gpumind"
version = "0.1.0"
description = "AI-Powered GPU Resource Manager — auto-switch between mining and AI inference"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pyyaml>=6.0",
]

[project.scripts]
gpumind = "gpumind.core:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["gpumind*"]
